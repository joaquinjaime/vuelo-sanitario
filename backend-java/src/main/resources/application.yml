server:
  port: 8080
  servlet:
    multipart:
      max-file-size: ${MAX_PDF_BYTES:10485760}
      max-request-size: ${MAX_PDF_BYTES:10485760}

spring:
  application:
    name: vuelos-sanitarios-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=vuelos_sanitarios;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, no Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Configuracion propia de JWT (se usa mas adelante en la capa de seguridad)
app:
  # DATETIME2 de solicitudes se interpreta como hora civil de esta zona, nunca como reloj del navegador o SQL Server.
  business-time-zone: ${BUSINESS_TIME_ZONE:America/Argentina/Tucuman}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  # Plazo de 48 h de informes finales: el bloqueo se evalúa en cada operación; este barrido sólo emite avisos.
  final-report:
    sweep-enabled: ${FINAL_REPORT_SWEEP_ENABLED:true}
    sweep-ms: ${FINAL_REPORT_SWEEP_MS:60000}
    sweep-initial-ms: ${FINAL_REPORT_SWEEP_INITIAL_MS:30000}
    due-soon-hours: ${FINAL_REPORT_DUE_SOON_HOURS:12}
  storage:
    documents-directory: ${DOCUMENTS_DIRECTORY:./data/documents}
    max-pdf-bytes: ${MAX_PDF_BYTES:10485760}
    document-lock-seconds: ${DOCUMENT_LOCK_SECONDS:300}
  # Análisis antimalware de la documentación de habilitaciones (clamd por TCP). Sin analizador configurado ningún documento puede aprobarse: falla de forma segura.
  antimalware:
    enabled: ${APP_ANTIMALWARE_ENABLED:false}
    host: ${APP_ANTIMALWARE_HOST:}
    port: ${APP_ANTIMALWARE_PORT:3310}
    timeout-ms: ${APP_ANTIMALWARE_TIMEOUT_MS:20000}
    retry-ms: ${APP_ANTIMALWARE_RETRY_MS:300000}
    retry-initial-ms: ${APP_ANTIMALWARE_RETRY_INITIAL_MS:120000}
    retry-after-seconds: ${APP_ANTIMALWARE_RETRY_AFTER_SECONDS:60}
  # Avisos preventivos de vencimiento de habilitaciones.
  # Revisión de los vuelos abiertos tras crear o dar de baja una política de suficiencia (asíncrona y coalescida).
  crew-eligibility:
    policy-review-enabled: ${APP_CREW_ELIGIBILITY_POLICY_REVIEW_ENABLED:true}
  credential-expiry:
    enabled: ${APP_CREDENTIAL_EXPIRY_ENABLED:true}
    notice-days: ${APP_CREDENTIAL_EXPIRY_NOTICE_DAYS:60,30,7,0}
    catch-up-days: ${APP_CREDENTIAL_EXPIRY_CATCH_UP_DAYS:30}
    sweep-ms: ${APP_CREDENTIAL_EXPIRY_SWEEP_MS:3600000}
    sweep-initial-ms: ${APP_CREDENTIAL_EXPIRY_SWEEP_INITIAL_MS:90000}
  # Retención de documentación personal: no existe política aprobada, por lo que no hay ninguna purga automática. Este indicador sólo se informa.
  retention:
    credential-documents:
      purge-enabled: false
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  # Correo saliente (verificación de correos). Sin MAIL_ENABLED=true y un servidor, el servicio informa "no configurado":
  # nada se envía, no se simula una entrega y ningún correo queda verificado. Las credenciales sólo llegan por entorno.
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    starttls: ${MAIL_STARTTLS:true}
    ssl: ${MAIL_SSL:false}
    from: ${MAIL_FROM:}
    # Dirección pública de la aplicación, que se menciona en el mensaje ("ingrese en Mi cuenta de ...").
    public-url: ${APP_PUBLIC_URL:}
  # Verificación de correos: código de un solo uso, vencimiento, intentos y límites de envío.
  verification:
    code-minutes: ${EMAIL_VERIFICATION_CODE_MINUTES:30}
    max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
    resend-seconds: ${EMAIL_VERIFICATION_RESEND_SECONDS:60}
    max-per-email-per-day: ${EMAIL_VERIFICATION_MAX_PER_EMAIL_PER_DAY:5}
    max-per-user-per-day: ${EMAIL_VERIFICATION_MAX_PER_USER_PER_DAY:10}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false   # la salud del backend no depende de que el servidor de correo responda
  endpoint:
    health:
      probes:
        enabled: true

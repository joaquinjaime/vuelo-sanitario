server:
  port: 8080
  servlet:
    multipart:
      max-file-size: ${MAX_PDF_BYTES:10485760}
      max-request-size: ${MAX_PDF_BYTES:10485760}

spring:
  application:
    name: vuelos-sanitarios-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=vuelos_sanitarios;encrypt=true;trustServerCertificate=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo maneja Flyway, no Hibernate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Configuracion propia de JWT (se usa mas adelante en la capa de seguridad)
app:
  # DATETIME2 de solicitudes se interpreta como hora civil de esta zona, nunca como reloj del navegador o SQL Server.
  business-time-zone: ${BUSINESS_TIME_ZONE:America/Argentina/Tucuman}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  storage:
    documents-directory: ${DOCUMENTS_DIRECTORY:./data/documents}
    max-pdf-bytes: ${MAX_PDF_BYTES:10485760}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

name: vuelos-sanitarios

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD in .env}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    ports:
      - "14330:1433"


  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure MSSQL_SA_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-vuelos_app}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      DB_NAME: vuelos_sanitarios
    volumes:
      - ./docker/sqlserver/init-db.sh:/scripts/init-db.sh:ro
    networks: [internal]
    command: ["/bin/bash", "/scripts/init-db.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend-java
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=vuelos_sanitarios;encrypt=true;trustServerCertificate=true
      DB_USERNAME: ${DB_USERNAME:-vuelos_app}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET in .env}
      DOCUMENTS_DIRECTORY: /data/documents
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-10485760}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost}
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - documents_data:/data/documents
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  sqlserver_data:
  documents_data:

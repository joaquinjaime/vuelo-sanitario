# clamd para producción (servicio `clamav` de docker-compose.yml, perfil `antimalware`): base completa mantenida por freshclam.
# Sólo escucha en la red interna de Compose; no se publica ningún puerto en el anfitrión.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
# Las subidas están limitadas a 10 MiB por la aplicación; el analizador admite un margen.
MaxFileSize 25M
StreamMaxLength 25M
MaxScanSize 100M
# Recargar la base de firmas sin duplicar la memoria (el valor por defecto mantiene dos copias durante la recarga).
ConcurrentDatabaseReload no

# clamd de las pruebas E2E aisladas: motor ClamAV real con una base de firmas MÍNIMA (sólo la cadena de prueba EICAR, db/e2e-eicar.ndb).
# Sirve para probar la integración (protocolo, cuarentena, rechazo y falla segura) con poca memoria y sin descargar firmas.
# NO ofrece cobertura antimalware real: en producción debe ejecutarse ClamAV con la base completa y actualizaciones de freshclam
# (servicio `clamav` de docker-compose.yml, perfil `antimalware`).
Foreground yes
DatabaseDirectory /etc/clamav-e2e/db
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
MaxFileSize 25M
StreamMaxLength 25M
MaxScanSize 100M
